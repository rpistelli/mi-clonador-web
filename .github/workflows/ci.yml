name: CI
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clone Website
        run: |
          # Usamos la URL que necesitas clonar
          export URL="https://web.archive.org/web/20250329232311/https://cabanaslosolivos.com.ar/"
          # Este comando es el que suele usar esta plantilla para descargar
          npx website-cloner $URL --output website-content
          
      - name: Upload Files
        uses: actions/upload-artifact@v3
        with:
          name: website-content
          path: website-content/
