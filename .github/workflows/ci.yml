name: CI

on:
workflow_dispatch:
    inputs:
      website_url:
        description: 'URL del sitio a clonar'
        required: true
        default: 'https://web.archive.org/web/20250329232311/https://cabanaslosolivos.com.ar/'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
